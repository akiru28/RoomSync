<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Welcome to RoomSync, the room and laboratory reservation system for Camarines Sur Polytechnic Colleges.">
  <meta name="theme-color" content="#12355B">
  <title>RoomSync</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 1.5rem;
      background: #091a30;
      isolation: isolate;
      transition: opacity .5s ease, transform .5s cubic-bezier(.2, .75, .25, 1);
    }
    body::before {
      content: "";
      position: fixed;
      z-index: -1;
      inset: -5%;
      background:
        radial-gradient(ellipse at 22% 25%, rgba(65, 139, 224, .3), transparent 38%),
        radial-gradient(ellipse at 78% 75%, rgba(61, 119, 194, .24), transparent 36%),
        linear-gradient(145deg, rgba(9, 26, 48, .72), rgba(10, 20, 38, .92)),
        url("../assets/images/bg.jpg") center / cover no-repeat;
      animation: background-drift 22s ease-in-out infinite alternate;
      will-change: transform;
    }
    body.leaving { opacity: 0; transform: scale(1.035); }
    .splash {
      position: relative;
      isolation: isolate;
      width: min(100%, 34rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      padding: clamp(2rem, 7vw, 3.5rem) clamp(1.5rem, 6vw, 3rem);
      text-align: center;
      color: #fff;
      animation: splash-in .9s cubic-bezier(.2, .75, .25, 1) both;
      will-change: transform, opacity;
    }
    .splash::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: -45%;
      left: 50%;
      width: 75%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(120, 180, 255, .2);
      filter: blur(70px);
      transform: translateX(-50%);
      animation: glow-breathe 5s ease-in-out infinite alternate;
    }
    .splash-logo {
      position: relative;
      z-index: 1;
      width: clamp(6rem, 24vw, 8.5rem);
      height: clamp(6rem, 24vw, 8.5rem);
      object-fit: contain;
      filter: drop-shadow(0 .75rem 1.5rem rgba(0, 0, 0, .28));
      animation: logo-float 4s ease-in-out 1s infinite;
      will-change: transform, filter;
    }
    .splash-kicker {
      margin: .25rem 0 -.75rem;
      color: rgba(255, 255, 255, .72);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .splash h1 {
      margin: 0;
      font-size: clamp(2.25rem, 9vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -.045em;
      line-height: 1.1;
    }
    .splash p {
      max-width: 30ch;
      margin: 0;
      color: rgba(255, 255, 255, .82);
      line-height: 1.65;
    }
    .splash-progress {
      position: relative;
      width: min(12rem, 70vw);
      height: 3px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, .18);
      box-shadow: 0 0 14px rgba(153, 197, 255, .12);
      margin: .35rem 0 .1rem;
    }
    .splash-progress span {
      display: block;
      width: 100%;
      height: 100%;
      transform: scaleX(0);
      transform-origin: left;
      border-radius: inherit;
      background: linear-gradient(90deg, #8fc5ff, #fff, #b9d9ff);
      box-shadow: 0 0 12px rgba(185, 217, 255, .65);
      animation: splash-progress 2.2s cubic-bezier(.22, .61, .36, 1) forwards;
    }
    .splash-link {
      display: inline-flex;
      min-height: 2.9rem;
      align-items: center;
      justify-content: center;
      padding: .7rem 1.35rem;
      border: 1px solid rgba(255, 255, 255, .5);
      border-radius: 999px;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }
    .splash-link:hover {
      transform: translateY(-2px);
      border-color: #fff;
      background: rgba(255, 255, 255, .14);
    }
    .splash-link:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }
    @keyframes splash-in {
      from { opacity: 0; transform: translateY(22px) scale(.97); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes splash-progress { to { transform: scaleX(1); } }
    @keyframes background-drift {
      from { transform: scale(1.02) translate3d(-.5%, -.5%, 0); }
      to { transform: scale(1.09) translate3d(.5%, .5%, 0); }
    }
    @keyframes glow-breathe {
      from { opacity: .55; transform: translateX(-50%) scale(.85); }
      to { opacity: 1; transform: translateX(-50%) scale(1.12); }
    }
    @keyframes logo-float {
      0%, 100% { transform: translateY(0); filter: drop-shadow(0 .75rem 1.5rem rgba(0, 0, 0, .28)); }
      50% { transform: translateY(-7px); filter: drop-shadow(0 1rem 1.7rem rgba(97, 165, 255, .32)); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        will-change: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="splash">
    <img class="splash-logo" src="../assets/logos/logo.png" alt="" fetchpriority="high">
    <h1>RoomSync</h1>
    <div class="splash-progress" aria-hidden="true">
      <span></span>
    </div>
  </main>
  <script>
    const destination = localStorage.getItem('rr_token') && localStorage.getItem('rr_user')
      ? 'dashboard.html'
      : 'home.html';
    setTimeout(() => {
      document.body.classList.add('leaving');
      setTimeout(() => location.replace(destination), 500);
    }, 2200);
  </script>
</body>
</html>
